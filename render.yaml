services:
  - type: web
    name: malanga1-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python seed.py && python manage.py seed_superuser && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "malanga"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "mutalaadnan4@gmail.com"
      - key: DATABASE_URL
        fromDatabase:
          name: malanga1-db
          property: connectionString
  - type: web
    name: malanga1-frontend
    runtime: node
    rootDir: malanga1companyltd-main
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    envVars:
      - key: VITE_API_URL
        value: https://malanga1-backend.onrender.com/api
      - key: NODE_VERSION
        value: "22"
databases:
  - name: malanga1-db
    plan: free
    databaseName: malanga1
    user: malanga1
