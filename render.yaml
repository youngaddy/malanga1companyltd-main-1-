services:
  - type: web
    name: malanga1-backend
    runtime: python
    rootDir: backend
    plan: starter
    disk:
      name: media
      mountPath: /var/lib/backend/media
      sizeGB: 1
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_MEDIA_ROOT
        value: /var/lib/backend/media
      - key: DATABASE_URL
        fromDatabase:
          name: malanga1-db
          property: connectionString
databases:
  - name: malanga1-db
    plan: basic-256mb
    databaseName: malanga1
    user: malanga1
