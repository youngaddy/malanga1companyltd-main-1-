services:
  - type: web
    name: malanga1-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python seed.py && python manage.py seed_superuser && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "malanga"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "mutalaadnan4@gmail.com"
      - key: DATABASE_URL
        fromDatabase:
          name: malanga1-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        value: "j1k7ai8b"
      - key: CLOUDINARY_API_KEY
        value: "828539382883754"
      - key: CLOUDINARY_API_SECRET
        value: "N9Zw42Ad4xSbwt8x6he2iP2YwLM"

  - type: static_site
    name: malanga1-frontend
    rootDir: malanga1companyltd-main
    buildCommand: npm run build
    staticPublishPath: dist/client
    envVars:
      - key: VITE_API_URL
        value: https://malanga1-backend.onrender.com/api

databases:
  - name: malanga1-db
    plan: free
    databaseName: malanga1
    user: malanga1
