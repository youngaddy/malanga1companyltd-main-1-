services:
  - type: web
    name: malanga1-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn main:app --workers 1 --bind 0.0.0.0:$PORT -k uvicorn.workers.UvicornWorker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: malanga1-db
          property: connectionString

  - type: static_site
    name: malanga1-frontend
    rootDir: malanga1companyltd-main
    buildCommand: npm run build
    staticPublishPath: dist/client
    envVars:
      - key: VITE_API_URL
        value: https://malanga1-backend.onrender.com/api

databases:
  - name: malanga1-db
    plan: free
    databaseName: malanga1
    user: malanga1
